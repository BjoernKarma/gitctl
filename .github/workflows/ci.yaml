name: Run CI

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - 'v*'
  pull_request:
  schedule:
    - cron: '0 0 * * *'  # Runs every day at midnight UTC

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    permissions:
      contents: read
      pull-requests: write
      checks: write
    uses: telekom/controlplane/.github/workflows/component-build.yaml@fb4339b77133b8fa10240586b089e2d502d6ab17
    with:
      name: gitctl
      module: .
      run_check_generated_files: false
      lint_fail_on_issues: true

  package:
    name: Package
    needs: build
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write
    uses: telekom/controlplane/.github/workflows/component-package-build.yaml@fb4339b77133b8fa10240586b089e2d502d6ab17
    with:
      name: gitctl
      module: .
      ko_build_path: main.go
